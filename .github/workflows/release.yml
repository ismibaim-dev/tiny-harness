# Publishes a GitHub Release with prebuilt binaries. Two ways to start it:
#   - push a version tag: git tag v0.3.1 && git push origin v0.3.1
#   - Actions tab -> release -> "Run workflow" on main (works in the GitHub mobile app):
#     releases main as v<const version>, creating the tag.
# A release made first with GitHub's "Draft a new release" button also works: the assets are added to it.
# The install link in README.md points at the latest release's assets.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Pick the version
        run: |
          v=$(sed -n 's/^const version = "\(.*\)"$/\1/p' main.go)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::run the release workflow on main (got $GITHUB_REF)"
              exit 1
            fi
            tag="v$v"
            # an existing tag must point at this commit, so a tag never ends up with another commit's binaries
            git fetch --quiet origin "refs/tags/$tag:refs/tags/$tag" 2>/dev/null || true
            if have=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
              if [ "$have" != "$GITHUB_SHA" ]; then
                echo "::error::$tag already exists at $have; bump const version in main.go to release this commit"
                exit 1
              fi
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$v" ]; then
              echo "::error::tag $tag does not match const version $v in main.go"
              exit 1
            fi
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "releasing $tag"

      - name: Test
        run: go vet ./... && go test -race ./...

      - name: Build
        run: |
          mkdir -p release
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" \
              -o "release/tiny-harness-$os-$arch$ext" .
          done
          cd release && sha256sum tiny-harness-* > SHA256SUMS && cat SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "tiny-harness $TAG" --generate-notes
          fi
